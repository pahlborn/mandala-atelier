<!DOCTYPE html>
<html lang="de" data-theme="hell">
<head>
<meta charset="utf-8">
<title>Mandala Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Mandalas gestalten und kolorieren – ein Symmetrie-Werkzeug für ruhige Stunden. Offline, ohne Konto, ohne Werbung.">
<meta name="theme-color" content="#f3ece1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mandala">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>Mandala Atelier</h1>
    <p class="claim">Zeichne ein Segment – der Rest entsteht von selbst.</p>
  </div>
  <div class="topbar-actions">
    <button type="button" id="btn-library-toggle" class="chip" aria-expanded="false" aria-controls="library">Motive</button>
    <button type="button" id="btn-theme" class="chip" title="Hell / Dunkel umschalten">Dunkel</button>
  </div>
</header>

<main class="atelier">

  <!-- ---------------------------------------------------------------
       Motivwelten
       --------------------------------------------------------------- -->
  <aside id="library" class="library" aria-label="Motivwelten">
    <button type="button" class="motif blank" data-motif="">
      <span class="motif-name">Leeres Blatt</span>
      <span class="motif-note">Nur Symmetrie, keine Vorlage</span>
    </button>
    <div id="worlds"></div>
    <p class="library-foot">
      19 Vorlagen in 5 Welten. Ein Motiv setzt die Achsenzahl passend –
      du kannst sie danach jederzeit ändern.
    </p>
  </aside>

  <!-- ---------------------------------------------------------------
       Zeichenfläche: vier übereinanderliegende Ebenen
       --------------------------------------------------------------- -->
  <section class="stage" aria-label="Zeichenfläche">
    <div class="canvas-stack" id="stack">
      <canvas id="guideCanvas" aria-hidden="true"></canvas>
      <canvas id="fillCanvas" aria-hidden="true"></canvas>
      <canvas id="drawCanvas" role="img" aria-label="Mandala – hier zeichnen und füllen"></canvas>
      <canvas id="labelCanvas" aria-hidden="true"></canvas>
    </div>
    <p class="stage-hint" id="stage-hint">Wähle ein Motiv oder beginne auf dem leeren Blatt.</p>
  </section>

  <!-- ---------------------------------------------------------------
       Bedienleiste
       --------------------------------------------------------------- -->
  <aside class="controls" aria-label="Werkzeuge">

    <section class="panel">
      <h2>Werkzeug</h2>
      <div class="tools" role="group" aria-label="Werkzeug wählen">
        <button type="button" class="tool is-active" data-tool="pen">Stift</button>
        <button type="button" class="tool" data-tool="fill">Füllen</button>
        <button type="button" class="tool" data-tool="eraser">Radierer</button>
      </div>
      <label class="field">
        <span>Strichstärke</span>
        <input type="range" id="width" min="1" max="14" step="1" value="4">
      </label>
    </section>

    <section class="panel">
      <h2>Farbe</h2>
      <div class="palette" id="palette" role="group" aria-label="Pigment wählen"></div>
    </section>

    <section class="panel" id="legend-panel" hidden>
      <h2 id="legend-title">Farblegende</h2>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="panel">
      <h2>Symmetrie</h2>
      <div class="axes" id="axes" role="group" aria-label="Achsenzahl"></div>
      <label class="switch">
        <input type="checkbox" id="mirror">
        <span>Spiegelung</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="guides" checked>
        <span>Hilfsraster</span>
      </label>
    </section>

    <section class="panel">
      <h2>Blatt</h2>
      <div class="row">
        <button type="button" id="btn-undo" class="action">Rückgängig</button>
        <button type="button" id="btn-clear" class="action">Zurücksetzen</button>
      </div>
      <button type="button" id="btn-save" class="action primary">Als Bild speichern</button>
    </section>

  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
